```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- SEO Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sneha Dasgupta for web development and portfolio-related inquiries.">
    <meta name="keywords" content="contact, Sneha Dasgupta, web developer, frontend developer">
    <meta name="author" content="Sneha Dasgupta">

    <title>Contact Me | Sneha Dasgupta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip link for keyboard users -->
    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <!-- Header -->
    <header role="banner">

        <div class="container">

            <h1>Sneha Dasgupta</h1>

            <!-- Main Navigation -->
            <nav aria-label="Main navigation">

                <ul>

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="about.html">About</a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- Main Content -->
    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <div class="container">

                <h2 id="contact-heading">Contact Me</h2>

                <p>
                    If you would like to get in touch, please fill out
                    the form below.
                </p>

                <!-- Accessible Contact Form -->
                <form action="#" method="post" aria-label="Contact form">

                    <!-- Name -->
                    <div>

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                        >

                    </div>

                    <!-- Email -->
                    <div>

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        >

                    </div>

                    <!-- Subject -->
                    <div>

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true"
                        >

                    </div>

                    <!-- Message -->
                    <div>

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"
                        ></textarea>

                    </div>

                    <!-- Submit Button -->
                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer role="contentinfo">

        <div class="container">

            <p>
                &copy; 2026 Sneha Dasgupta. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
```
